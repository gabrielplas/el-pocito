<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Pocito · Administración</title>
<meta name="theme-color" content="#0b0c0b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#0b0c0b; --bg-2:#121412; --card:#161816; --card-2:#1d201d; --ink:#f2f4ec; --muted:#9ba29a; --line:rgba(var(--tint),.08); --line-2:rgba(var(--tint),.14);
  --brand:#e2f58b; --brand-2:#eefab3; --brand-ink:#0b0c0b; --brand-soft:rgba(226,245,139,.13);
  --warn:#f4c870; --warn-soft:rgba(244,200,112,.13); --bad:#ff7d6e; --bad-soft:rgba(255,125,110,.14); --ok:#8fe2ad; --ok-soft:rgba(143,226,173,.13);
  --accent:#e2f58b; --tint:255,255,255; --nav-bg:rgba(18,20,18,.78); --menu-bg:rgba(8,9,8,.42); --pill:rgba(var(--tint),.12);
  --fab-bg:#f4f4ef; --fab-ink:#0b0c0b; --mark-bg:#e2f58b; --mark-ink:#0b0c0b; --warn-ink:#f8e2b4; --opt-bg:#1d201d; --stack:#1f2421;
  --radius:22px; --fs:16px; --nav-w:min(560px,calc(100vw - 24px)); color-scheme:dark;
  --ease:cubic-bezier(.22,.9,.24,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --nav-h:76px;
}
:root[data-theme="light"]{
  --bg:#f3f3ee; --bg-2:#ffffff; --card:#ffffff; --card-2:#f6f6f1; --ink:#121412; --muted:#5f665e; --line:rgba(11,12,11,.09); --line-2:rgba(11,12,11,.16);
  --brand:#dcf37a; --brand-2:#e6f79c; --brand-ink:#0b0c0b; --brand-soft:rgba(160,195,30,.16); --accent:#4f6b00;
  --warn:#9a5b00; --warn-soft:#fbefd6; --bad:#c0392b; --bad-soft:#fde6e2; --ok:#1f7a48; --ok-soft:#e1f3e8; --warn-ink:#6d4300;
  --tint:11,12,11; --nav-bg:rgba(255,255,255,.85); --menu-bg:rgba(243,243,238,.5); --pill:rgba(255,255,255,.88);
  --fab-bg:#0b0c0b; --fab-ink:#e2f58b; --mark-bg:#0b0c0b; --mark-ink:#e2f58b; --opt-bg:#fff; --stack:#e3e4dc; color-scheme:light;
}
html.big{--fs:19px} html.huge{--fs:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs);background:var(--bg);transition:background .3s}
body{transition:background .3s,color .3s}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .5rem;line-height:1.15;font-weight:600;letter-spacing:-.015em}
h2{font-size:1.5rem} h3{font-size:1.08rem}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:.86rem}
.right{text-align:right} .nowrap{white-space:nowrap}
svg.i{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:20;padding:calc(.7rem + env(safe-area-inset-top)) 1rem .7rem;display:flex;align-items:center;gap:.5rem;background:linear-gradient(var(--bg) 45%,transparent);}
.top .who{display:flex;align-items:center;gap:.55rem;flex:1;min-width:0}
.top .mark{width:34px;height:34px;border-radius:50%;background:var(--mark-bg);color:var(--mark-ink);display:grid;place-items:center;flex:none}
.top .mark svg{width:20px;height:20px}
.top .title{font-weight:700;font-size:.98rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .title small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.top button{background:rgba(var(--tint),.07);border:1px solid var(--line);color:var(--ink);height:38px;min-width:38px;padding:0 .7rem;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;font-size:.85rem;font-weight:600;transition:background .2s,transform .15s}
.top button:hover{background:rgba(var(--tint),.13)}
.top button:active{transform:scale(.94)}
.top button.syncb{min-width:30px;width:30px;padding:0;background:transparent;border:0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#555;box-shadow:0 0 0 4px rgba(var(--tint),.04)}
.dot.ok{background:var(--ok)}.dot.err{background:var(--bad)}

/* ---------- Bottom nav ---------- */
nav.bnav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;width:var(--nav-w);height:var(--nav-h);display:flex;justify-content:space-around;align-items:center;padding:0 .4rem;background:var(--nav-bg);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
nav.bnav button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.28rem;padding:.4rem .2rem;cursor:pointer;font-size:.72rem;font-weight:600;position:relative;transition:color .25s}
nav.bnav button .ic{width:44px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .35s var(--ease),transform .35s var(--spring)}
nav.bnav button.on{color:var(--ink)}
nav.bnav button.on .ic{background:var(--brand);color:var(--brand-ink);transform:scale(1.04)}
nav.bnav button:active .ic{transform:scale(.88)}
nav.bnav button span.l{white-space:nowrap;max-width:76px;overflow:hidden;text-overflow:ellipsis}
nav.bnav .badge{position:absolute;top:2px;right:calc(50% - 26px);min-width:16px;height:16px;border-radius:9px;background:var(--bad);color:#fff;font-size:.62rem;display:grid;place-items:center;padding:0 4px}

.fab{position:fixed;right:max(18px,calc(50% - var(--nav-w) / 2 + 6px));bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:var(--fab-bg);color:var(--fab-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.35);transition:transform .35s var(--spring)}
.fab svg{width:26px;height:26px;stroke-width:2.2}
.fab:hover{transform:scale(1.06)} .fab:active{transform:scale(.92)}

/* ---------- Blur menus (FAB / más) ---------- */
.bmenu{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:1.2rem max(18px,calc(50% - var(--nav-w) / 2 + 6px)) calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));background:var(--menu-bg);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);animation:bmIn .32s var(--ease) both;overflow:auto}
.bmenu.out{animation:bmOut .24s ease both}
.bmenu .mt-title{align-self:flex-end;color:var(--muted);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin:0 .4rem .4rem 0}
.bmenu .opts{display:flex;flex-direction:column;align-items:flex-end;gap:.75rem}
.bmenu .opt{display:flex;align-items:center;gap:.8rem;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);animation:optIn .42s var(--spring) both;animation-delay:calc(var(--i,0) * 38ms)}
.bmenu.out .opt{animation:optOut .2s ease both;animation-delay:calc(var(--r,0) * 22ms)}
.bmenu .opt .pl{background:var(--pill);border:1px solid var(--line);padding:.5rem 1rem;border-radius:999px;font-weight:600;font-size:.92rem;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bmenu .opt .rc{width:52px;height:52px;border-radius:50%;background:var(--fab-bg);color:var(--fab-ink);display:grid;place-items:center;transition:transform .25s var(--spring);flex:none}
.bmenu .opt .rc svg{width:22px;height:22px}
.bmenu .opt.on .rc{background:var(--brand);color:var(--brand-ink)}
.bmenu .opt.danger .rc{background:var(--bad);color:#fff}
.bmenu .opt:hover .rc{transform:scale(1.08)} .bmenu .opt:active .rc{transform:scale(.9)}
.bmenu .opt.close .rc{background:var(--fab-bg);opacity:.9;width:58px;height:58px;margin-top:.4rem}
@keyframes bmIn{from{opacity:0;backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0)}to{opacity:1}}
@keyframes bmOut{to{opacity:0}}
@keyframes optIn{from{opacity:0;transform:translate(24px,18px) scale(.85)}to{opacity:1;transform:none}}
@keyframes optOut{to{opacity:0;transform:translate(16px,10px) scale(.9)}}

main{max-width:1180px;margin:0 auto;padding:.5rem 1.25rem calc(var(--nav-h) + 110px)}

/* ---------- Screen & card motion ---------- */
main.enter{animation:scrIn .5s var(--ease) both}
main.enter.fwd{--dx:26px} main.enter.back{--dx:-26px}
@keyframes scrIn{from{opacity:0;transform:translateX(var(--dx,0)) translateY(8px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
main.enter .anim{animation:cardIn .6s var(--ease) both;animation-delay:calc(70ms + var(--i,0) * 45ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- Hero (estilo pillow) ---------- */
.heroX{position:relative;border-radius:30px;min-height:340px;max-height:460px;padding:1.3rem 1.3rem 1.2rem;margin:0 0 1.6rem;overflow:hidden;display:flex;flex-direction:column;color:#fff;isolation:isolate;
  background:#3b4a52}
.heroX::before{content:"";position:absolute;inset:-30%;z-index:-2;background:
  radial-gradient(40% 35% at 25% 20%,#8aa3ad 0%,transparent 70%),
  radial-gradient(45% 40% at 78% 72%,#e4ad84 0%,transparent 72%),
  radial-gradient(35% 30% at 70% 25%,#5e7682 0%,transparent 70%),
  radial-gradient(50% 45% at 20% 85%,#26323a 0%,transparent 70%);
  filter:blur(30px);animation:drift 18s ease-in-out infinite alternate}
.heroX::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.28))}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(4%,-3%) rotate(8deg)}100%{transform:translate(-3%,4%) rotate(-6deg)}}
.heroX .eye{display:flex;align-items:center;gap:.5rem;font-size:.8rem;opacity:.9}
.heroX .eye svg{width:18px;height:18px}
.heroX .greet{margin-top:auto;font-size:.95rem;opacity:.92}
.heroX .q{font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.05;font-weight:500;letter-spacing:-.03em;margin:.2rem 0 .8rem;max-width:16ch}
.heroX .spark{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);color:#222;display:grid;place-items:center}
.heroX .spark svg{width:16px;height:16px}
.heroX .acts{display:flex;justify-content:center;align-items:flex-end;gap:1.6rem;margin-top:1.2rem}
.heroX .acts button{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:.4rem;cursor:pointer;font-size:.82rem;font-weight:500}
.heroX .acts .c{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center;transition:transform .3s var(--spring),background .2s}
.heroX .acts .c.mainc{width:70px;height:70px;background:rgba(255,255,255,.26)}
.heroX .acts .c svg{width:22px;height:22px}
.heroX .acts .c.mainc svg{width:28px;height:28px}
.heroX .acts button:hover .c{background:rgba(255,255,255,.32);transform:translateY(-2px)}
.heroX .acts button:active .c{transform:scale(.9)}
.heroX .acts .c.sos{background:rgba(255,110,95,.55)}
.heroWrap{position:relative}
.heroWrap::after{content:"";position:absolute;left:5%;right:5%;bottom:-10px;height:30px;border-radius:0 0 26px 26px;background:var(--stack);z-index:-1}

/* ---------- Cards & layout ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem;margin-bottom:1rem;transition:transform .35s var(--ease),border-color .25s,background .25s}
.card:hover{border-color:var(--line-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.grid2>.card,.kpis>.card{margin-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.75rem;margin-bottom:1rem}
.kpi .lbl{font-size:.8rem;color:var(--muted)} .kpi .val{font-size:1.6rem;font-weight:600;margin-top:.2rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi.warn{background:linear-gradient(160deg,rgba(244,200,112,.16),var(--card) 70%);border-color:rgba(244,200,112,.25)}.kpi.bad{background:linear-gradient(160deg,rgba(255,125,110,.18),var(--card) 70%);border-color:rgba(255,125,110,.28)}
.hero .big{font-size:2.4rem;font-weight:600;margin:.2rem 0;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero.warn{background:linear-gradient(150deg,rgba(244,200,112,.2),var(--card) 65%)} .hero.ok{background:linear-gradient(150deg,rgba(226,245,139,.18),var(--card) 65%)}
.lbl{font-size:.85rem;color:var(--muted)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.mt{margin-top:.85rem}
.sect{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 1rem}
.sect h2{margin:0;font-size:clamp(1.6rem,5vw,2.1rem);font-weight:500;letter-spacing:-.03em}
.pgtitle{font-size:clamp(1.7rem,5vw,2.2rem);font-weight:500;letter-spacing:-.03em;margin:.2rem 0 1rem}

/* ---------- Buttons ---------- */
.btn{border:1px solid var(--line-2);background:rgba(var(--tint),.05);padding:.6rem 1rem;border-radius:999px;cursor:pointer;font-weight:600;transition:transform .2s var(--spring),background .2s,border-color .2s;color:var(--ink)}
.btn:hover{background:rgba(var(--tint),.1)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#1a0b09}
.btn.ghost{background:transparent}
.btn.sm{padding:.32rem .7rem;font-size:.82rem}
.btn.lg{padding:.9rem 1.3rem;font-size:1.02rem}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:none;font-weight:600}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.quick button{border:1px solid var(--line);background:var(--card-2);border-radius:18px;padding:1rem .8rem;cursor:pointer;font-weight:600;text-align:left;transition:transform .25s var(--spring),background .2s;color:var(--ink)}
.quick button:hover{background:var(--brand-soft)}
.quick button:active{transform:scale(.96)}
.quick button.danger{background:var(--bad-soft);color:var(--bad);border-color:rgba(255,125,110,.25)}
.seg{display:inline-flex;background:rgba(var(--tint),.06);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap}
.seg button{border:0;background:transparent;padding:.42rem .85rem;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;transition:background .3s var(--ease),color .2s}
.seg button.on{background:var(--ink);color:var(--bg)}

/* ---------- Tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:.65rem .8rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:rgba(var(--tint),.03);font-weight:600;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(var(--tint),.03)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;background:rgba(var(--tint),.04)}
.empty{padding:1.4rem;text-align:center;color:var(--muted)}
.tag{display:inline-block;padding:.16rem .6rem;border-radius:20px;font-size:.76rem;font-weight:600;background:rgba(var(--tint),.08);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.brand{background:var(--brand-soft);color:var(--accent)}
.thumb{width:42px;height:42px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer;vertical-align:middle}
.notice{background:var(--warn-soft);border:1px solid rgba(244,200,112,.25);color:var(--warn-ink);border-radius:18px;padding:.85rem 1.1rem;margin-bottom:1rem}
.notice.info{background:var(--brand-soft);border-color:rgba(226,245,139,.22);color:var(--ink)}
.notice .link{color:var(--warn)}
.alert .btn{background:#fff;color:#7a1a10;border-color:#fff}
.alert{background:linear-gradient(120deg,#d8402f,#ff6a55);color:#fff;padding:1rem 1.1rem;border-radius:20px;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;font-weight:600;animation:pulse 1.2s infinite alternate;box-shadow:0 10px 30px rgba(255,90,70,.3)}
@keyframes pulse{from{box-shadow:0 10px 30px rgba(255,90,70,.15)}to{box-shadow:0 10px 40px rgba(255,90,70,.55)}}
.list{display:flex;flex-direction:column;gap:.5rem}
.item{border:1px solid var(--line);border-radius:16px;padding:.8rem .9rem;background:var(--card-2);display:flex;justify-content:space-between;gap:.75rem;align-items:center;flex-wrap:wrap}
.item .t{font-weight:600}

/* ---------- Modals as sheets ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(6,7,6,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(14px + env(safe-area-inset-top)) 0 0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:bgIn .28s ease both}
.modal{background:var(--bg-2);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:1.4rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom));width:100%;max-width:600px;margin-top:auto;flex:none;box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:sheetIn .48s var(--ease) both;position:relative}
.modal::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;border-radius:4px;background:rgba(var(--tint),.18);transform:translateX(-50%)}
.modal.wide{max-width:900px}
.modal-bg.out{animation:bgOut .22s ease both}
.modal-bg.out .modal{animation:sheetOut .22s ease both}
@keyframes bgIn{from{opacity:0}to{opacity:1}} @keyframes bgOut{to{opacity:0}}
@keyframes sheetIn{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetOut{to{transform:translateY(40px);opacity:0}}
@media (min-width:720px){
  .modal-bg{padding:4vh 16px}
  .modal{border-radius:28px;border-bottom:1px solid var(--line);padding-bottom:1.4rem;margin:auto}
  .modal::before{display:none}
  @keyframes sheetIn{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
}
.modal h3{font-size:1.3rem;font-weight:600}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:.9rem 0}
.fld{display:flex;flex-direction:column;gap:.3rem}
.fld.full,.fld:has(textarea){grid-column:1/-1}
.fld span{font-size:.82rem;color:var(--muted);font-weight:600}
.fld small{color:var(--muted);font-size:.78rem}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2);border-radius:14px;padding:.7rem .85rem;background:rgba(var(--tint),.05);width:100%;transition:border-color .2s,background .2s}
.fld select option{background:var(--opt-bg);color:var(--ink)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--brand-soft);background:rgba(226,245,139,.05)}
.chk{display:flex;gap:.5rem;align-items:center;grid-column:1/-1}
.chk input{accent-color:var(--brand);width:18px;height:18px}
.mact{display:flex;justify-content:flex-end;gap:.5rem;margin-top:.6rem}
.imgfull{max-width:100%;border-radius:14px}
.err{color:var(--bad);text-align:center;min-height:1.4em}
.logi{padding:.65rem .85rem}
.foot{text-align:center;color:var(--muted);font-size:.75rem;margin:2rem 0 0;opacity:.7}
.modal .mact{position:sticky;bottom:0;background:var(--bg-2);padding-top:.6rem;margin-bottom:-.2rem}

<div id="app"></div>

<script>
'use strict';
/* ============ Constantes ============ */
const APP_VER = '2.3';
const NOVEDADES = [
  ['2.3', 'Paquetes: entrega marcada por caseta o por la casa · Apartado de palapa y estacionamiento con autorización · Botón para salir en caseta'],
  ['2.2', 'Cobros en efectivo por vigilantes con entrega y confirmación del administrador · Bitácora de accesos y actividad · Ventanas corregidas en celular'],
  ['2.1', 'Sincronización al guardar · Botón para sincronizar · Versión visible'],
  ['2.0', 'Nuevo diseño · Modo claro y oscuro · Letra grande · Montos en $ · Periodo de administración nov–oct']
];
const COLS = ['config','casas','cargos','abonos','ingresos','gastos','transferencias','vigilantes','ausencias','turnos',
  'visitas','preregistros','frecuentes','paquetes','avisos','votos','incidencias','documentos','directorio','servicios','alertas','logs','reservas'];
const CUENTAS = { banco: 'Cuenta bancaria', chica: 'Caja chica', vigilante: 'Fondo caseta' };
const CATS = ['Vigilancia (nómina)','Coberturas / reemplazos','Basura','Jardinería','CFE (luz)','Agua','Mantenimiento',
  'Limpieza','Administración / papelería','Extraordinario','Otros'];
const TIPOS_VISITA = ['Visita','Familiar','Proveedor / servicio','Trabajador(a) del hogar','Paquetería','Taxi / app','Otro'];
const TIPOS_AUS = { vacaciones: 'Vacaciones', descanso: 'Descanso', permiso: 'Permiso', incapacidad: 'Incapacidad', falta: 'Falta' };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const NUM_CASAS = 7;
const anioActual = () => { const d = new Date(); return d.getMonth() >= 10 ? d.getFullYear() : d.getFullYear() - 1; };
const perIni = y => `${y}-11-01`, perFin = y => `${+y + 1}-10-31`;
const perLabel = y => `nov ${y} – oct ${+y + 1}`;
const enPer = (f, y) => { const x = String(f || '').slice(0, 10); return x >= perIni(y) && x <= perFin(y); };
const DEFAULT_CFG = { id: 'main', nombre: 'El Pocito', cuota: 0, casaAdmin: 1, anio: anioActual(), perNov: true, pinSistema: '0000', presupuesto: {} };

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NF = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = n => { const v = Math.round((+n || 0) * 100) / 100; return (v < 0 ? '-$' : '$') + NF.format(Math.abs(v)); };
const num = n => +n || 0;
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoDate(new Date());
const nowLocal = () => { const d = new Date(); return today() + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const ym = (d = today()) => String(d).slice(0, 7);
const mesLabel = m => { if (!m) return ''; const [y, mm] = m.split('-'); return MESES[+mm - 1] + ' ' + y; };
const toDate = d => new Date(String(d).length === 10 ? d + 'T12:00' : d);
const fdate = d => d ? toDate(d).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fdt = d => d ? toDate(d).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const ftime = d => d ? toDate(d).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : '';
const daysIncl = (a, b) => Math.round((toDate(b) - toDate(a)) / 864e5) + 1;
const addDays = (d, n) => { const x = toDate(d); x.setDate(x.getDate() + n); return isoDate(x); };
const sortBy = (arr, k, desc = true) => [...arr].sort((a, b) => (String(a[k] || '') < String(b[k] || '') ? -1 : String(a[k] || '') > String(b[k] || '') ? 1 : 0) * (desc ? -1 : 1));
const sum = (arr, f = x => x.monto) => arr.reduce((s, x) => s + num(f(x)), 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ============ Almacenamiento local ============ */
const memStore = {};
const LS = {
  get(k) { try { const v = localStorage.getItem(k); return v == null ? (memStore[k] ?? null) : JSON.parse(v); } catch (e) { return memStore[k] ?? null; } },
  set(k, v) { memStore[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { delete memStore[k]; try { localStorage.removeItem(k); } catch (e) { } }
};
/* ============ Bitácora del sistema ============ */
let LOG_OFF = false;
const COL_LBL = { config: 'configuración', casas: 'datos de casa', cargos: 'cargo / cuota', abonos: 'pago', ingresos: 'ingreso', gastos: 'gasto', transferencias: 'traspaso entre cajas', vigilantes: 'vigilante', ausencias: 'ausencia / cobertura', turnos: 'turno', visitas: 'visita', preregistros: 'aviso de visita', frecuentes: 'autorizado permanente', paquetes: 'paquete', avisos: 'aviso', votos: 'voto', incidencias: 'problema reportado', documentos: 'documento', directorio: 'contacto', servicios: 'servicio', alertas: 'emergencia', reservas: 'apartado de área común' };
function dispositivo() { const u = navigator.userAgent; return /iPad/.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1) ? 'iPad' : /iPhone/.test(u) ? 'iPhone' : /Android/.test(u) ? (/Mobile/.test(u) ? 'Android' : 'Tableta Android') : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : 'Otro'; }
function logEv(accion, detalle = '', tipo = 'acceso') {
  try { db.put('logs', { fecha: new Date().toISOString(), quien: SES ? quien() : 'Sin sesión', accion, detalle: String(detalle).slice(0, 200), tipo, disp: dispositivo(), ver: APP_VER }); } catch (e) { }
}
function autoLog(acc, c, r) {
  if (c === 'turnos' && acc === 'Editó' && !r.fin) return;
  const d = [r.casa ? 'Casa ' + r.casa : '', r.nombre || r.titulo || r.concepto || r.propietario || r.categoria || '', r.monto != null && r.monto !== '' ? money(r.monto) : '', r.estado ? '(' + String(r.estado).replace('_', ' ') + ')' : ''].filter(Boolean).join(' · ');
  logEv(acc + ' ' + (COL_LBL[c] || c), d, 'cambio');
}
const IDB = {
  db: null,
  open() { return new Promise(res => { try { const r = indexedDB.open('elpocito', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; res(true); }; r.onerror = () => res(false); } catch (e) { res(false); } }); },
  get(k) { return new Promise(res => { if (!this.db) return res(memStore['idb_' + k] ?? null); try { const t = this.db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result ?? null); t.onerror = () => res(null); } catch (e) { res(null); } }); },
  set(k, v) { return new Promise(res => { if (!this.db) { memStore['idb_' + k] = v; return res(); } try { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch (e) { res(); } }); }
};

/* ============ Estado y base de datos ============ */
let S = { cols: {}, dirty: {}, lastPull: null };
COLS.forEach(c => S.cols[c] = []);
let SES = null;                 // sesión de este dispositivo
const UI = { view: null, sub: {}, f: {} };

let persistT = null, pushT = null;
function persist() {
  clearTimeout(persistT); persistT = setTimeout(persistNow, 200);
  clearTimeout(pushT); pushT = setTimeout(sync, 1500);
}
function persistNow() { return IDB.set('state', JSON.parse(JSON.stringify(S))); }

const db = {
  all(c) { return S.cols[c].filter(r => !r._del); },
  get(c, id) { return S.cols[c].find(r => r.id === id && !r._del); },
  put(c, rec) {
    rec = { ...rec };
    if (!rec.id) rec.id = uid();
    if (!rec.creado) rec.creado = new Date().toISOString();
    rec._u = Date.now();
    const i = S.cols[c].findIndex(r => r.id === rec.id);
    if (i >= 0) S.cols[c][i] = rec; else S.cols[c].push(rec);
    S.dirty[c + '|' + rec.id] = rec._u; persist(); soonSync();
    if (c !== 'logs' && !LOG_OFF) autoLog(i >= 0 ? 'Editó' : 'Agregó', c, rec);
    return rec;
  },
  del(c, id) {
    const i = S.cols[c].findIndex(r => r.id === id); if (i < 0) return;
    const r = S.cols[c][i];
    S.cols[c][i] = { id: r.id, creado: r.creado, _del: true, _u: Date.now() };
    S.dirty[c + '|' + id] = S.cols[c][i]._u; persist(); soonSync();
    if (c !== 'logs' && !LOG_OFF) autoLog('Borró', c, r);
  }
};
const cfg = () => ({ ...DEFAULT_CFG, ...(S.cols.config.find(r => r.id === 'main') || {}) });
const setCfg = p => db.put('config', { ...cfg(), ...p });
const casaRec = n => db.get('casas', 'c' + n);
const casaLabel = n => { if (n === 'caseta') return 'Caseta'; if (!n) return 'Condominio'; const c = casaRec(n); return 'Casa ' + n + (c && c.propietario ? ' · ' + c.propietario : ''); };
const vigName = id => { const v = db.get('vigilantes', id); return v ? v.nombre : (id ? '—' : ''); };

function ensureBase() {
  LOG_OFF = true; try { ensureBase0(); } finally { LOG_OFF = false; }
}
function ensureBase0() {
  if (!S.cols.config.find(r => r.id === 'main')) db.put('config', { ...DEFAULT_CFG });
  else if (!S.cols.config.find(r => r.id === 'main').perNov) db.put('config', { ...S.cols.config.find(r => r.id === 'main'), perNov: true, anio: anioActual(), casaAdmin: 1 });
  for (let n = 1; n <= NUM_CASAS; n++) if (!S.cols.casas.find(r => r.id === 'c' + n)) db.put('casas', { id: 'c' + n, num: n, propietario: '', telefono: '', pin: String(n).repeat(4), cuota: null, emergencia: '', notas: '', mayor: false });
}

/* ============ Sincronización (Supabase) ============ */
const syncCfg = () => LS.get('pocito_sync') || {};
// Las claves nuevas (sb_publishable_...) van solo en apikey; las antiguas (JWT eyJ...) también como Bearer.
const sbHeaders = k => k && k.startsWith('eyJ') ? { apikey: k, Authorization: 'Bearer ' + k } : { apikey: k };
let syncState = { ok: null, msg: 'Modo local: los datos solo viven en este dispositivo', busy: false, last: null };
let pendingRender = false;
async function sync() {
  const c = syncCfg();
  if (!c.url || !c.key || syncState.busy) return;
  syncState.busy = true; updSyncDot();
  const base = c.url.replace(/\/+$/, '') + '/rest/v1/registros';
  const H = { ...sbHeaders(c.key), 'Content-Type': 'application/json' };
  try {
    const snap = { ...S.dirty };
    const rows = Object.keys(snap).map(k => { const [col, id] = k.split('|'); const rec = S.cols[col] && S.cols[col].find(r => r.id === id); return rec ? { id: col + ':' + id, coleccion: col, data: rec } : null; }).filter(Boolean);
    for (let i = 0; i < rows.length; i += 25) {
      const r = await fetch(base, { method: 'POST', headers: { ...H, Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(rows.slice(i, i + 25)) });
      if (!r.ok) throw new Error('al subir (' + r.status + ') ' + (await r.text()).slice(0, 140));
    }
    Object.keys(snap).forEach(k => { if (S.dirty[k] === snap[k]) delete S.dirty[k]; });
    let changed = false, more = true;
    while (more) {
      let q = base + '?select=coleccion,data,updated_at&order=updated_at.asc&limit=300';
      if (S.lastPull) q += '&updated_at=gt.' + encodeURIComponent(S.lastPull);
      const r = await fetch(q, { headers: H });
      if (!r.ok) throw new Error('al descargar (' + r.status + ') ' + (await r.text()).slice(0, 140));
      const rows2 = await r.json();
      for (const row of rows2) {
        const col = row.coleccion, d = row.data;
        if (S.cols[col] && d && d.id) {
          const i = S.cols[col].findIndex(x => x.id === d.id);
          if (i < 0) { S.cols[col].push(d); changed = true; }
          else if (num(d._u) > num(S.cols[col][i]._u)) { S.cols[col][i] = d; changed = true; }
        }
        S.lastPull = row.updated_at;
      }
      more = rows2.length === 300;
    }
    syncState = { ok: true, msg: 'Sincronizado', busy: false, last: new Date() };
    await persistNow();
    if (changed) render(true);
  } catch (e) {
    syncState = { ok: false, msg: 'Sin conexión con la nube: ' + e.message, busy: false, last: syncState.last };
  }
  syncState.busy = false; updSyncDot();
}
let _ss; function soonSync() { clearTimeout(_ss); _ss = setTimeout(() => { if (syncCfg().url) sync(); }, 1200); }
async function syncNow() {
  if (!syncCfg().url) return toast('Modo local: los datos solo están en este dispositivo');
  toast('Sincronizando…'); await sync();
  toast(syncState.ok ? 'Sincronizado ✓' : 'No se pudo sincronizar: revisa tu internet');
}
function updSyncDot() {
  const d = document.getElementById('syncdot'); if (!d) return;
  const c = syncCfg();
  d.className = 'dot ' + (!c.url ? '' : syncState.ok ? 'ok' : syncState.ok === false ? 'err' : '');
  d.title = syncState.msg + (syncState.last ? ' · ' + syncState.last.toLocaleTimeString('es-MX') : '');
}

/* ============ Cálculos ============ */
const gastosValidos = () => db.all('gastos').filter(g => !g.estado || g.estado === 'aprobado');
function saldoCasa(n) {
  return sum(db.all('cargos').filter(c => c.casa == n)) - sum(db.all('abonos').filter(a => a.casa == n && a.estado === 'confirmado'));
}
function movimientos(c) {
  const m = [];
  db.all('abonos').forEach(a => { if (a.estado === 'confirmado' && a.cuenta === c) m.push({ fecha: a.fecha, concepto: 'Pago ' + casaLabel(a.casa) + (a.nota ? ' – ' + a.nota : ''), ent: num(a.monto) }); });
  db.all('ingresos').forEach(i => { if (i.cuenta === c) m.push({ fecha: i.fecha, concepto: i.concepto, ent: num(i.monto) }); });
  db.all('transferencias').forEach(t => {
    if (t.a === c) m.push({ fecha: t.fecha, concepto: 'Recibido de ' + CUENTAS[t.de] + (t.nota ? ' – ' + t.nota : ''), ent: num(t.monto) });
    if (t.de === c) m.push({ fecha: t.fecha, concepto: 'Enviado a ' + CUENTAS[t.a] + (t.nota ? ' – ' + t.nota : ''), sal: num(t.monto) });
  });
  gastosValidos().forEach(g => { if (g.cuenta === c) m.push({ fecha: g.fecha, concepto: g.categoria + ' – ' + g.concepto, sal: num(g.monto), g }); });

}

// Vacaciones según LFT (reforma 2023): 12 días el primer año, +2 por año hasta 20; luego +2 cada 5 años.
function diasVacLFT(anios) { if (anios < 1) return 0; if (anios <= 5) return 12 + (anios - 1) * 2; return 20 + Math.ceil((anios - 5) / 5) * 2; }
function vacInfo(v) {
  const sd = num(v.sueldo) / ({ semanal: 7, quincenal: 15, mensual: 30 }[v.periodo] || 30);
  if (!v.ingreso) return { sd, anios: 0, derecho: 0, tomados: 0, pend: 0, sinFecha: true };
  const ing = toDate(v.ingreso), hoy = new Date();
  let anios = hoy.getFullYear() - ing.getFullYear();
  const aniv = new Date(ing); aniv.setFullYear(ing.getFullYear() + anios);
  if (aniv > hoy) anios--;
  const inicioPer = new Date(ing); inicioPer.setFullYear(ing.getFullYear() + Math.max(anios, 0));
  const ini = isoDate(inicioPer);
  const derecho = diasVacLFT(anios);
  const tomados = db.all('ausencias').filter(a => a.vigilanteId === v.id && a.tipo === 'vacaciones' && a.desde >= ini).reduce((s, a) => s + daysIncl(a.desde, a.hasta), 0);
  const proxAniv = new Date(inicioPer); proxAniv.setFullYear(inicioPer.getFullYear() + 1);
  const y0 = new Date(hoy.getFullYear(), 0, 1); const desde = ing > y0 ? ing : y0;
  const diasAnio = Math.min(365, Math.round((new Date(hoy.getFullYear(), 11, 31) - desde) / 864e5) + 1);
  return { sd, anios, derecho, tomados, pend: derecho - tomados, ini, proxAniv: isoDate(proxAniv), prima: sd * derecho * 0.25, aguinaldo: sd * 15 * diasAnio / 365, diasAnio };
}
function ausenciasEn(fecha) { return db.all('ausencias').filter(a => a.desde <= fecha && a.hasta >= fecha); }
function turnoActivo() { return sortBy(db.all('turnos').filter(t => !t.fin), 'inicio')[0] || null; }
function estadoServicio(s) {
  const pagos = sortBy(gastosValidos().filter(g => g.servicioId === s.id), 'fecha');
  const ult = pagos[0];
  const hoy = today();
  let venc;
  if (s.frecuencia === 'semanal') { venc = ult ? addDays(ult.fecha, 7) : hoy; }
  else {
    const meses = s.frecuencia === 'bimestral' ? 2 : 1;
    if (ult) { const d = toDate(ult.fecha); d.setDate(1); d.setMonth(d.getMonth() + meses); const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(num(s.dia) || 1, dim)); venc = isoDate(d); }
    else { const d = new Date(); const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(num(s.dia) || 1, dim)); venc = isoDate(d); }
  }
  const dias = Math.round((toDate(venc) - toDate(hoy)) / 864e5);
  return { ult, venc, dias, cls: dias < 0 ? 'bad' : dias <= 5 ? 'warn' : 'ok', txt: dias < 0 ? 'Vencido hace ' + (-dias) + ' día(s)' : dias === 0 ? 'Vence hoy' : 'Vence en ' + dias + ' día(s)' };
}

/* ============ Archivos e imágenes ============ */
function readFile(file) {
  return new Promise((res, rej) => {
    if (file.type.startsWith('image/')) {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => { const max = 1100; let { width: w, height: h } = img; if (w > max || h > max) { const k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); } const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', .65)); };
      img.onerror = () => rej(new Error('No se pudo leer la imagen'));
      img.src = url;
    } else {
      if (file.size > 4 * 1024 * 1024) { toast('El archivo pesa más de 4 MB. Usa uno más ligero.'); return res(null); }
      const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file);
    }
  });
}
function openData(dataUrl) {
  if (!dataUrl) return;
  if (dataUrl.startsWith('data:image')) return modal(`<img class="imgfull" src="${dataUrl}"><div class="mact"><button class="btn" onclick="closeModal()">Cerrar</button></div>`);
  const [h, b] = dataUrl.split(','); const mime = h.slice(5).split(';')[0];
  const bin = atob(b); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  window.open(URL.createObjectURL(new Blob([arr], { type: mime })), '_blank');
}
const FILES = {};
function fileBtn(dataUrl) {
  if (!dataUrl) return '<span class="muted small">—</span>';
  const k = uid(); FILES[k] = dataUrl;
  return dataUrl.startsWith('data:image') ? `<img class="thumb" src="${dataUrl}" onclick="openData(FILES['${k}'])" alt="comprobante">` : `<button class="btn sm" onclick="openData(FILES['${k}'])">Ver archivo</button>`;
}

/* ============ Modales y formularios ============ */
function modal(html, wide) {
  const el = document.createElement('div'); el.className = 'modal-bg';
  el.innerHTML = `<div class="modal ${wide ? 'wide' : ''}">${html}</div>`;
  el.addEventListener('mousedown', e => { if (e.target === el) closeModal(); });
  $('#modals').appendChild(el);
  const f = el.querySelector('input:not([type=hidden]):not([type=file]),select,textarea'); if (f && !('ontouchstart' in window)) f.focus();
  return el;
}
function closeModal() { const m = $('#modals').lastElementChild; if (m) { document.body.appendChild(m); m.classList.add('out'); setTimeout(() => m.remove(), 230); } if (!$('#modals').children.length && pendingRender) { pendingRender = false; render(); } }
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function confirmar(msg, fn, okTxt = 'Sí, continuar') {
  modal(`<h3>${esc(msg)}</h3><div class="mact"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn danger" id="cfok">${esc(okTxt)}</button></div>`);
  $('#cfok').onclick = () => { closeModal(); fn(); render(); };
}
function field(f) {
  if (f.type === 'html') return f.html;
  const v = f.value ?? '', req = f.required ? 'required' : '', full = f.full ? ' full' : '';
  let inp;
  switch (f.type) {
    case 'select': inp = `<select name="${f.name}" ${req}>${f.options.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`; break;
    case 'textarea': inp = `<textarea name="${f.name}" rows="3" ${req} placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>`; break;
    case 'file': inp = `<input type="file" name="${f.name}" accept="${f.accept || 'image/*'}">`; break;
    case 'checkbox': return `<label class="chk"><input type="checkbox" name="${f.name}" ${v ? 'checked' : ''}> ${esc(f.label)}</label>`;
    case 'number': inp = `<input type="number" name="${f.name}" value="${esc(v)}" step="${f.step || '0.01'}" inputmode="decimal" ${req} ${f.min != null ? 'min="' + f.min + '"' : ''}>`; break;
    default: inp = `<input type="${f.type || 'text'}" name="${f.name}" value="${esc(v)}" ${req} placeholder="${esc(f.placeholder || '')}" ${f.maxlength ? 'maxlength="' + f.maxlength + '"' : ''} ${f.inputmode ? 'inputmode="' + f.inputmode + '"' : ''}>`;
  }
  return `<label class="fld${full}"><span>${esc(f.label)}</span>${inp}${f.help ? `<small>${esc(f.help)}</small>` : ''}</label>`;
}
function openForm(title, fields, onSubmit, opts = {}) {
  const el = modal(`<form id="mf" novalidate><h3>${esc(title)}</h3>${opts.intro || ''}<div class="fields">${fields.map(field).join('')}</div><div class="err" id="mferr"></div><div class="mact"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="mfok">${esc(opts.ok || 'Guardar')}</button></div></form>`, opts.wide);
  const form = el.querySelector('#mf');
  form.onsubmit = async e => {
    e.preventDefault();
    for (const f of fields) if (f.required && f.name) { const inp = form.elements[f.name]; if (inp && !String(inp.value).trim()) { $('#mferr').textContent = 'Falta: ' + f.label; inp.focus(); return; } }
    const btn = $('#mfok'); btn.disabled = true;
    try {
      const fd = new FormData(form), out = {};
      for (const f of fields) {
        if (!f.name) continue;
        if (f.type === 'file') { const file = fd.get(f.name); out[f.name] = file && file.size ? await readFile(file) : (f.keep || null); }
        else if (f.type === 'checkbox') out[f.name] = fd.get(f.name) === 'on';
        else if (f.type === 'number') out[f.name] = fd.get(f.name) === '' ? null : parseFloat(fd.get(f.name));
        else out[f.name] = (fd.get(f.name) ?? '').toString().trim();
      }
      const r = await onSubmit(out, form);
      if (typeof r === 'string') { $('#mferr').textContent = r; btn.disabled = false; return; }
      el.remove(); render(); if (opts.toast !== false) toast(opts.toast || 'Guardado');
    } catch (err) { $('#mferr').textContent = err.message; btn.disabled = false; }
  };
}

function calendarioAus() {
  const m = UI.f.calMes || ym();
  const [y, mm] = m.split('-').map(Number);
  const first = new Date(y, mm - 1, 1), dim = new Date(y, mm, 0).getDate();
  const off = (first.getDay() + 6) % 7;
  let cells = '';
  for (let i = 0; i < off; i++) cells += '<div></div>';
  for (let d = 1; d <= dim; d++) {
    const f = `${y}-${pad(mm)}-${pad(d)}`; const a = ausenciasEn(f);
    cells += `<div class="cal ${f === today() ? 'today' : ''}"><div class="small muted">${d}</div>${a.map(x => `<div class="calx ${x.tipo === 'vacaciones' ? 'vac' : ''}">${esc(vigName(x.vigilanteId).split(' ')[0])} → ${esc((x.cubreId ? vigName(x.cubreId) : x.cubreNombre || '?').split(' ')[0])}</div>`).join('')}</div>`;
  }
  return `<div class="card"><div class="row sp"><h3 style="margin:0">Calendario · ${mesLabel(m)}</h3><input type="month" value="${m}" onchange="UI.f.calMes=this.value;render()"></div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:.6rem">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(d => `<div class="small muted" style="text-align:center">${d}</div>`).join('')}${cells}</div>
    <div class="small muted mt">Formato: quien falta → quien cubre</div></div>`;
}

  if (w) xs = xs.filter(l => l.quien === w);
  const hoy = db.all('logs').filter(l => String(l.fecha).slice(0, 10) === today() && l.accion === 'Inició sesión').length;
  const fallos = db.all('logs').filter(l => l.accion === 'PIN incorrecto' && l.fecha > addDays(today(), -7)).length;

  ${xs.length ? `<div class="list">${xs.slice(0, 300).map(l => `<div class="item logi"><div style="min-width:0;flex:1"><div class="t">${l.accion === 'PIN incorrecto' ? '<span class="tag bad">PIN incorrecto</span>' : l.tipo === 'acceso' ? '<span class="tag brand">' + esc(l.accion) + '</span>' : esc(l.accion)} ${l.detalle ? '<span class="muted" style="font-weight:500">· ' + esc(l.detalle) + '</span>' : ''}</div><div class="small muted">${esc(l.quien)} · ${fdt(l.fecha)} · ${esc(l.disp || '')} · v${esc(l.ver || '')}</div></div></div>`).join('')}</div>` : '<div class="tw"><div class="empty">Sin actividad registrada</div></div>'}
  ${xs.length > 300 ? '<p class="small muted mt">Se muestran los 300 más recientes.</p>' : ''}`;

/* ---- Áreas comunes ---- */
const hm = t => String(t || '').slice(0, 5);
function resItem(r) {
  const mine = isCasa() && SES.casa == r.casa, fut = r.fecha >= today();
  const ligada = r.grupo ? db.all('reservas').find(x => x.grupo === r.grupo && x.id !== r.id && x.estado !== 'cancelada' && x.estado !== 'rechazada') : null;
  const acc = [];
  if (isAdmin() && r.estado === 'solicitada') acc.push(`<button class="btn sm primary" onclick="A.autorizarRes('${r.id}')">Autorizar${ligada && ligada.estado === 'solicitada' ? ' ambos' : ''}</button>`, `<button class="btn sm" onclick="A.rechazarRes('${r.id}')">Rechazar</button>`);
  if ((mine || isAdmin()) && fut && ['solicitada', 'aprobada'].includes(r.estado)) acc.push(`<button class="btn sm ghost" onclick="A.cancelarRes('${r.id}')">Cancelar</button>`);
  return `<div class="item"><div style="min-width:0"><div class="t"><span class="tag ${r.area === 'palapa' ? 'brand' : ''}">${AREAS[r.area]}</span> ${fdate(r.fecha)} · ${hm(r.horaIni)}–${hm(r.horaFin)}</div>
    <div class="small muted">${esc(casaLabel(r.casa))}${r.motivo ? ' · ' + esc(r.motivo) : ''}${r.invitados ? ' · ' + esc(r.invitados) + ' invitados' : ''}${ligada ? ' · con ' + AREAS[ligada.area].toLowerCase() : ''}</div>
    <div style="margin-top:.3rem">${tagEstado(r.estado)}${r.estado === 'aprobada' && r.autorizadoPor ? ` <span class="small muted">${esc(r.autorizadoPor)}</span>` : ''}${r.estado === 'rechazada' && r.motivoRechazo ? ` <span class="small muted">${esc(r.motivoRechazo)}</span>` : ''}</div></div>
    ${acc.length ? `<div class="row">${acc.join('')}</div>` : ''}</div>`;
}
function choqueRes(area, fecha, ini, fin, excl) {
  return db.all('reservas').find(r => r.area === area && r.fecha === fecha && ['solicitada', 'aprobada'].includes(r.estado) && r.grupo !== excl && hm(r.horaIni) < fin && ini < hm(r.horaFin));
}
V.areas = () => {
  const f = UI.sub.areas || 'prox';

  const opts = [['prox', 'Próximos'], ...(isCasa() ? [['mias', 'Míos']] : []), ['hist', 'Historial']];
  return `<div class="sect"><h2>Áreas comunes</h2><button class="btn primary" onclick="A.reservar()">${ic('plus')} Apartar</button></div>

  ${sol.length && (isAdmin() || isCasa()) ? `<div class="card"><h3>${isAdmin() ? 'Solicitudes por autorizar' : 'Solicitudes pendientes'}</h3><div class="list">${sol.filter(r => isAdmin() || r.casa == SES.casa).map(resItem).join('') || '<p class="muted small">Ninguna tuya</p>'}</div></div>` : ''}

};

/* ============ Acciones ============ */
const A = {};
A.reservar = (areaIni) => {
  const adm = isAdmin() && !(isCasa() && false);
  openForm('Apartar área común', [
    { name: 'area', label: '¿Qué quieres apartar?', type: 'select', options: [['palapa', 'Palapa'], ['estacionamiento', 'Estacionamiento']], value: areaIni || 'palapa' },
    { type: 'html', html: '<label class="chk" id="conEst"><input type="checkbox" name="conEst"> ¿También apartar el estacionamiento?</label>' },
    ...(isCasa() && !isAdmin() ? [] : [{ name: 'casa', label: 'Casa', type: 'select', options: casaOpts('Elige la casa'), value: isCasa() ? SES.casa : '', required: true }]),
    { name: 'fecha', label: 'Fecha', type: 'date', value: today(), required: true },
    { name: 'horaIni', label: 'Desde', type: 'time', value: '14:00', required: true },
    { name: 'horaFin', label: 'Hasta', type: 'time', value: '22:00', required: true },
    { name: 'invitados', label: 'Invitados aprox.', type: 'number', step: '1' },
    { name: 'motivo', label: 'Motivo', placeholder: 'Ej. cumpleaños, reunión familiar', full: true }
  ], v => {
    const casa = +(v.casa || (isCasa() ? SES.casa : 0)); if (!casa) return 'Elige la casa';
    if (v.fecha < today()) return 'La fecha ya pasó';
    if (v.horaFin <= v.horaIni) return 'La hora final debe ser después de la inicial';
    const areas = [v.area]; if (v.area === 'palapa' && $('#mf').elements.conEst.checked) areas.push('estacionamiento');
    for (const a of areas) { const c = choqueRes(a, v.fecha, v.horaIni, v.horaFin); if (c) return `${AREAS[a]} ya está apartado ese día de ${hm(c.horaIni)} a ${hm(c.horaFin)} (${casaLabel(c.casa)})`; }
    const grupo = areas.length > 1 ? uid() : '';
    const admin = isAdmin();
    areas.forEach(a => db.put('reservas', { area: a, casa, fecha: v.fecha, horaIni: v.horaIni, horaFin: v.horaFin, invitados: v.invitados, motivo: v.motivo, grupo, estado: admin ? 'aprobada' : 'solicitada', solicitadoPor: quien(), autorizadoPor: admin ? 'Registrado por ' + quien() : '' }));
  }, { ok: 'Apartar', toast: isAdmin() ? 'Apartado registrado' : 'Solicitud enviada al administrador' });
  const f = $('#mf'), sync = () => { $('#conEst').style.display = f.elements.area.value === 'palapa' ? '' : 'none'; if (f.elements.area.value !== 'palapa') f.elements.conEst.checked = false; };
  f.elements.area.addEventListener('change', sync); sync();
};
A.autorizarRes = id => { const r = db.get('reservas', id); const grp = r.grupo ? db.all('reservas').filter(x => x.grupo === r.grupo && x.estado === 'solicitada') : [r];
  for (const x of grp) { const c = choqueRes(x.area, x.fecha, hm(x.horaIni), hm(x.horaFin), x.grupo || '_'); if (c && c.id !== x.id && c.estado === 'aprobada') return toast(AREAS[x.area] + ' ya está autorizado a ' + casaLabel(c.casa) + ' en ese horario'); }
  grp.forEach(x => db.put('reservas', { ...x, estado: 'aprobada', autorizadoPor: 'Autorizó ' + quien(), autorizadoEn: new Date().toISOString() })); render(); toast(grp.length > 1 ? 'Palapa y estacionamiento autorizados' : 'Autorizado'); };
A.rechazarRes = id => { const r = db.get('reservas', id); openForm('Rechazar apartado', [{ name: 'motivoRechazo', label: 'Motivo (la casa lo verá)', required: true, full: true }], v => { db.put('reservas', { ...r, estado: 'rechazada', motivoRechazo: v.motivoRechazo, autorizadoPor: quien() }); }, { ok: 'Rechazar', toast: 'Rechazado' }); };
A.cancelarRes = id => { const r = db.get('reservas', id); const lig = r.grupo ? db.all('reservas').filter(x => x.grupo === r.grupo && x.id !== r.id && ['solicitada', 'aprobada'].includes(x.estado)) : [];
  const doit = arr => arr.forEach(x => db.put('reservas', { ...x, estado: 'cancelada', canceladoPor: quien() }));
  if (lig.length) { modal(`<h3>¿Qué quieres cancelar?</h3><p class="small muted">Este apartado incluye ${AREAS[lig[0].area].toLowerCase()}.</p><div class="mact" style="flex-wrap:wrap"><button class="btn" onclick="closeModal()">No cancelar</button><button class="btn" id="cx1">Solo ${AREAS[r.area].toLowerCase()}</button><button class="btn danger" id="cx2">Ambos</button></div>`);
    $('#cx1').onclick = () => { closeModal(); doit([r]); render(); toast('Cancelado'); }; $('#cx2').onclick = () => { closeModal(); doit([r, ...lig]); render(); toast('Cancelados'); }; }
  else confirmar(`¿Cancelar ${AREAS[r.area].toLowerCase()} del ${fdate(r.fecha)}?`, () => doit([r]), 'Sí, cancelar');
};

const metodoCuenta = m => m === 'Efectivo' ? 'chica' : 'banco';

A.borrar = (col, id) => confirmar('¿Borrar este registro?', () => db.del(col, id), 'Borrar');

  { name: 'fecha', label: 'Fecha', type: 'date', value: today(), required: true },

A.pagoAdmin = () => openForm('Registrar pago de una casa', [
  { name: 'casa', label: 'Casa', type: 'select', options: casaOpts() },
  { name: 'monto', label: 'Monto', type: 'number', required: true },
  { name: 'fecha', label: 'Fecha', type: 'date', value: today() },
  { name: 'metodo', label: 'Forma de pago', type: 'select', options: ['Transferencia', 'Depósito', 'Efectivo'] },
  { name: 'cuenta', label: 'Entró a', type: 'select', options: cuentaOpts(['banco', 'chica']) },
  { name: 'nota', label: 'Nota' },
  { name: 'comprobante', label: 'Comprobante', type: 'file', accept: 'image/*,application/pdf', full: true }
], v => { if (!(v.monto > 0)) return 'Escribe el monto'; db.put('abonos', { ...v, casa: +v.casa, estado: 'confirmado', registradoPor: quien() }); });
A.confirmarPago = id => { const a = db.get('abonos', id); openForm((a.recibidoPor ? 'Confirmar que recibiste el efectivo · ' : 'Confirmar pago de ') + 'Casa ' + a.casa + ' · ' + money(a.monto), [{ name: 'cuenta', label: '¿A dónde entró el dinero?', type: 'select', options: cuentaOpts(['banco', 'chica']), value: a.cuenta || metodoCuenta(a.metodo) }], v => { db.put('abonos', { ...a, cuenta: v.cuenta, estado: 'confirmado', confirmadoPor: quien(), confirmadoEn: new Date().toISOString() }); }, { ok: 'Confirmar', toast: 'Pago confirmado', intro: a.recibidoPor ? `<p class="small muted">Lo cobró ${esc(a.recibidoPor)} el ${fdate(a.fecha)}${a.entregadoEn ? ' · te lo entregó el ' + fdt(a.entregadoEn) : ''}<br>Al confirmar se abona al estado de cuenta de la casa.</p>` : '' }); };
A.rechazarPago = id => { const a = db.get('abonos', id); openForm('Rechazar pago', [{ name: 'motivo', label: 'Motivo', required: true }], v => { db.put('abonos', { ...a, estado: 'rechazado', nota: (a.nota || '') + ' · Rechazado: ' + v.motivo }); }, { ok: 'Rechazar' }); };

/* ---- Cuotas y cargos ---- */
const cuotaDe = n => { const r = casaRec(n) || {}; return r.cuota != null && r.cuota !== '' ? num(r.cuota) : num(cfg().cuota); };
A.generarCuotas = () => {
  const m = ym();
  openForm('Generar cuotas del mes', [
    { name: 'mes', label: 'Mes', type: 'month', value: m, required: true },
    { type: 'html', html: '<p class="small muted" style="grid-column:1/-1;margin:0">Monto de cada casa (se toma la cuota general o la propia de la casa). Pon 0 para no cobrarle.</p>' },
    ...Array.from({ length: NUM_CASAS }, (_, i) => ({ name: 'c' + (i + 1), label: casaLabel(i + 1), type: 'number', value: cuotaDe(i + 1) }))
  ], v => {
    let creadas = 0, omit = 0;
    for (let n = 1; n <= NUM_CASAS; n++) {
      const monto = num(v['c' + n]); if (!monto) continue;
      const clave = 'cuota-' + v.mes;
      if (db.all('cargos').some(c => c.casa == n && c.clave === clave)) { omit++; continue; }
      db.put('cargos', { casa: n, fecha: v.mes + '-01', concepto: 'Cuota de mantenimiento ' + mesLabel(v.mes), monto, tipo: 'ordinaria', clave }); creadas++;
    }
    setTimeout(() => toast(`${creadas} cuota(s) generadas${omit ? ', ' + omit + ' ya existían' : ''}`), 50);
  }, { ok: 'Generar', toast: false });
};
A.cuotaEspecial = () => openForm('Cuota especial', [

const SQL_SETUP = `create table if not exists registros (
  id text primary key,
  coleccion text not null,
  data jsonb not null,
  updated_at timestamptz not null default now()
);
create index if not exists registros_updated on registros(updated_at);
create or replace function registros_touch() returns trigger as $$
begin new.updated_at = clock_timestamp(); return new; end $$ language plpgsql;
drop trigger if exists registros_touch on registros;
create trigger registros_touch before insert or update on registros
  for each row execute function registros_touch();
grant select, insert, update, delete on registros to anon, authenticated;
alter table registros enable row level security;
drop policy if exists acceso_app on registros;
create policy acceso_app on registros for all using (true) with check (true);`;
A.syncConfig = () => { const c = syncCfg(); openForm('Conectar a Supabase', [
  { name: 'url', label: 'Project URL', value: c.url, required: true, placeholder: 'https://xxxx.supabase.co', full: true },
  { name: 'key', label: 'Clave pública (anon / publishable key)', value: c.key, required: true, full: true }
], async v => {
  let url = v.url.trim().replace(/\/+$/, '').replace(/\/rest\/v1.*$/, '');
  const m = url.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i); if (m) url = 'https://' + m[1] + '.supabase.co';
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)) return 'La URL debe verse así: https://xxxxx.supabase.co (la escribiste como: ' + url + ')';
  try { const r = await fetch(url + '/rest/v1/registros?select=id&limit=1', { headers: sbHeaders(v.key.trim()) }); if (!r.ok) { const t = await r.text(); return 'No se pudo conectar (' + r.status + '): ' + t.slice(0, 220) + (t.includes('PGRST205') || r.status === 404 ? ' → En SQL Editor corre: notify pgrst, \'reload schema\';  y vuelve a intentar.' : ''); } }
  catch (e) { return 'No se pudo conectar: ' + e.message; }
  LS.set('pocito_sync', { url, key: v.key.trim() }); S.lastPull = null;
  COLS.forEach(col => S.cols[col].forEach(r => S.dirty[col + '|' + r.id] = r._u));
  await persistNow(); await sync();
}, { wide: true, ok: 'Probar y conectar', toast: 'Conectado', intro: `<p class="small">1. Crea un proyecto gratis en supabase.com. 2. En <b>SQL Editor</b> corre este código una sola vez. 3. En <b>Project Settings → API</b> copia la URL y la clave pública.</p><code class="blk">${esc(SQL_SETUP)}</code><button type="button" class="btn sm mt" onclick="navigator.clipboard.writeText(SQL_SETUP).then(()=>toast('SQL copiado'))">Copiar SQL</button>` }); };
A.desconectar = () => confirmar('¿Desconectar este dispositivo de la nube? Los datos locales se conservan.', () => { LS.del('pocito_sync'); syncState = { ok: null, msg: 'Modo local', busy: false, last: null }; }, 'Desconectar');

A.importar = file => { if (!file) return; const fr = new FileReader(); fr.onload = () => { try {
  const d = JSON.parse(fr.result); if (!d.cols) throw new Error('Archivo no válido'); let n = 0;
  COLS.forEach(col => (d.cols[col] || []).forEach(rec => { const i = S.cols[col].findIndex(x => x.id === rec.id); if (i < 0 || num(rec._u) > num(S.cols[col][i]._u)) { if (i < 0) S.cols[col].push(rec); else S.cols[col][i] = rec; S.dirty[col + '|' + rec.id] = rec._u; n++; } }));
  persist(); logEv('Restauró respaldo', n + ' registros', 'cambio'); render(); toast(n + ' registros restaurados');
} catch (e) { toast('Error: ' + e.message); } }; fr.readAsText(file); };

/* ============ Arranque ============ */
async function init() {
  const p = new URLSearchParams(location.search);
  if (p.get('conectar')) { try { const c = JSON.parse(atob(p.get('conectar'))); if (c.url && c.key) LS.set('pocito_sync', c); } catch (e) { } history.replaceState(null, '', location.pathname); }
  await IDB.open();
  const st = await IDB.get('state');
  if (st && st.cols) { S = st; COLS.forEach(c => { if (!S.cols[c]) S.cols[c] = []; }); S.dirty = S.dirty || {}; }
  ensureBase();
  SES = LS.get('pocito_ses');
  if (SES && SES.tipo === 'caseta' && !db.get('vigilantes', SES.vigilanteId)) SES = null;
  let spl = true; try { spl = !sessionStorage.getItem('pocito_spl'); sessionStorage.setItem('pocito_spl', '1'); } catch (e) { }
  if (spl) { const sp = document.createElement('div'); sp.className = 'splash'; sp.innerHTML = `<div class="lg">${LOGO_SVG}<b>el pocito</b></div>`; document.body.appendChild(sp); setTimeout(() => sp.remove(), 1900); }
  render();
  if (syncCfg().url) { syncState.msg = 'Conectando…'; await sync(); }
  setInterval(() => { if (!document.hidden) sync(); }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
}
init();
